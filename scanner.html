<!DOCTYPE html>
<html>
<body>
<h2>QR Scanner</h2>

<video id="preview" width="300"></video>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode"></script>

<script>
    const scanner = new Html5QrcodeScanner("preview", { fps: 10, qrbox: 250 });

    function onScanSuccess(decoded) {
        fetch("http://localhost:5000/api/guests/scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: decoded })
        })
        .then(r => r.json())
        .then(data => {
            alert(JSON.stringify(data));
        });
    }

    scanner.render(onScanSuccess);
</script>

</body>
</html>
